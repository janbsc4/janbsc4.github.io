title: Jan Balanyà Scholl
author: Jan Balanyà Scholl
url: https://janbalanya.com # root address of the site
description: I am an account manager based in Barcelona. Here I write about pretty much everything. Find out more!
permalink: /:slug

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  appearance_toggle: true # if appearance can be switched by user
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_navbar: true # show horizontal navbar
  show_footer: true # show footer links from _data/home.yml
  show_blog: true # show blog posts added in _posts
  show_reading_time: true # show number of words and reading time in the blog posts
  home:
    title_blog: Blog


highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - AGENTS.md
  - CODE_AUDIT.md
  - curriculum

defaults:
  # Default for English (root _posts)
  - scope:
      path: ""
      type: "posts"
    values:
      lang: "en"
  # Default for Spanish (inside _posts/es/)
  - scope:
      path: "_posts/es"
    values:
      lang: "es"
      permalink: /es/:title/
  - scope:
      path: "_posts/de"
    values:
      lang: "de"
      permalink: /de/:title/
  - scope:
      path: "_posts/cat"
    values:
      lang: "cat"
      permalink: /cat/:title/
