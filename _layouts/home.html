---
layout: default
---

<header class="page-intro home-intro">
  <p class="eyebrow">Barcelona · Notes &amp; projects</p>
  <h1>{{ site.title }}</h1>
</header>

<div class="home-deck">
  {{ content }}
</div>

{% if site.theme_config.show_blog == true %}
  <section class="home-section" aria-labelledby="recent-writing">
    <div class="section-heading">
      <h2 id="recent-writing"><a href="/blog">{{ site.theme_config.home.title_blog }}</a></h2>
      <span aria-hidden="true">Recent writing</span>
    </div>
    {% include home_post_list.html %}
  </section>
{% endif %}
