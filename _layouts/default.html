<!DOCTYPE html>
<html lang="{{ page.lang | default: "en" }}" class="html" data-theme="{{ site.theme_config.appearance | default: "auto" }}">
	{%- include head.html -%}
		<body class="layout-{{ page.layout | default: 'default' }}{% if page.body_class %} {{ page.body_class }}{% endif %}">
		<a class="skip-link" href="#main-content">Skip to content</a>
		<div class="site-shell site-shell--standard">
			{% include site_header.html %}
			<main id="main-content" class="page-content{% if page.collection == 'posts' %} page-content--post{% endif %}" aria-label="Content" tabindex="-1">
				{{ content }}
			</main>
			{% include site_footer.html %}
		</div>
	</body>
</html>
