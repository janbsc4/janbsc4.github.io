profile: >-
  I'm an experienced marketing manager and team lead. At Credera, I led
  international analytics and web-tracking initiatives for Volkswagen Group,
  managing cross-functional teams and supporting critical digital projects
  that generated over €1 million in annual revenue. At Service Club, I'm
  heading the Marketing GTM team launching our product in new markets.

