profile: >-
  Soy un profesional sénior del marketing y responsable de equipos con amplia
  experiencia. En Credera lideré iniciativas internacionales de analítica y
  medición web para Volkswagen Group, gestionando equipos multidisciplinares y
  apoyando proyectos digitales estratégicos que generaron más de un millón de
  euros de ingresos anuales. En Service Club dirijo el equipo de marketing
  encargado de lanzar nuestro producto en nuevos mercados.

experience:
  - id: service-club
    company: Service Club
    title: Responsable de estrategia de entrada a nuevos mercados
    dates: 2026 — Actualidad
    start: "2026"
    description: >-
      Lidero la estrategia de marketing para la expansión de Service Club a
      nuevos mercados, con responsabilidad integral sobre localización, SEO,
      GEO y adquisición orgánica. Aprovecho herramientas de IA en todo el
      proceso para avanzar más rápido y operar con mayor eficiencia, desde el
      desarrollo web hasta la creación de nuevos embudos de crecimiento
      mediante la experimentación continua.
  - id: sabbatical
    title: Año sabático profesional y proyectos personales
    dates: "2025"
    start: "2025"
    quiet: true
  - id: credera-team-lead
    company: Credera
    title: Responsable de equipo y consultor avanzado
    dates: 2022 — 2024
    start: "2022"
    end: "2024"
    description: >-
      Lideré un equipo de siete consultores que desarrollaba proyectos
      digitales para Volkswagen Group en entornos ágiles. Gestioné equipos
      multidisciplinares e impulsé iniciativas estratégicas que generaron más
      de un millón de euros de ingresos anuales, además de acompañar el
      desarrollo de consultores júnior.
  - id: credera-junior
    company: Credera
    title: Consultor júnior de analítica
    dates: 2021 — 2022
    start: "2021"
    end: "2022"
    description: >-
      Generé conclusiones basadas en datos mediante analítica web e implementé
      soluciones de medición web a medida. Lideré proyectos orientados por
      datos.
  - id: finment
    company: Finment
    title: Responsable de marketing digital
    dates: 2019 — 2020
    start: "2019"
    end: "2020"
    description: >-
      Impulsé el crecimiento digital mejorando el posicionamiento SEO,
      desarrollando estrategias de contenido basadas en datos con Ahrefs,
      automatizando campañas de correo electrónico y creando un programa de
      marketing de afiliación que generaba ingresos.

